<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>6D Mandelbrot — 3D Slice</title>
<style>
	html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
	canvas { display: block; width: 100%; height: 100%; }
	#gl { position: absolute; top: 0; left: 0; z-index: 1; }
	#axes-overlay { position: absolute; top: 0; left: 0; z-index: 2; pointer-events: none; }
	#hud {
		position: fixed; top: 8px; left: 8px; color: rgb(254, 235, 181);
		font: 12px monospace; pointer-events: none; white-space: pre;
		text-shadow: 0 0 4px #000; z-index: 3;
	}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="axes-overlay"></canvas>
<div id="hud"></div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
